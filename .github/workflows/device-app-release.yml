# DeviceApp 원격 업데이트용 빌드
#
# main 브랜치에 push하면
#   1. 릴리즈 키로 서명한 APK를 빌드하고
#   2. Releases의 device-app-latest(프리릴리즈)에 APK와 version.json을 올린다.
# 기기에 깔린 앱은 version.json을 10분마다 확인해 새 빌드를 받아 두고,
# 기기 소유자(device owner)로 등록된 기기에서는 한가할 때 스스로 설치한다.
# (lib/services/update_service.dart)
#
# 필요한 저장소 Secrets (Settings → Secrets and variables → Actions)
#   ANDROID_KEYSTORE_BASE64   android/my-release-key.jks를 base64로 바꾼 값
#   ANDROID_KEYSTORE_PASSWORD key.properties의 storePassword
#   ANDROID_KEY_PASSWORD      (선택) keyPassword가 storePassword와 다를 때만

name: DeviceApp release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

# 연달아 push하면 앞의 빌드는 취소하고 마지막 것만 올린다.
concurrency:
  group: device-app-release
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.44.8
  RELEASE_TAG: device-app-latest
  KEY_ALIAS: my-key
  # 이전 저장소(sjiot/platform-backend)에서 올린 마지막 빌드가 104.
  # 이 저장소의 run 번호는 1부터 다시 시작하므로 그보다 항상 크게 시작한다.
  BUILD_OFFSET: 200

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 서명 키 복원
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secret이 없습니다."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/my-release-key.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../my-release-key.jks\n' \
            "$STORE_PASSWORD" "${KEY_PASSWORD:-$STORE_PASSWORD}" "$KEY_ALIAS" > android/key.properties

      - name: APK 빌드
        run: |
          BUILD_NUMBER=$((BUILD_OFFSET + GITHUB_RUN_NUMBER))
          VERSION_NAME=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/')
          MANIFEST_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/version.json"

          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

          flutter pub get
          flutter build apk --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define=BUILD_NUMBER="$BUILD_NUMBER" \
            --dart-define=UPDATE_MANIFEST_URL="$MANIFEST_URL"

          cp build/app/outputs/flutter-apk/app-release.apk "device_app-$BUILD_NUMBER.apk"

      - name: version.json 작성
        run: |
          APK="device_app-$BUILD_NUMBER.apk"
          cat > version.json <<JSON
          {
            "buildNumber": $BUILD_NUMBER,
            "versionName": "$VERSION_NAME",
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/$APK",
            "sha256": "$(sha256sum "$APK" | cut -d' ' -f1)",
            "size": $(stat -c%s "$APK"),
            "commit": "$GITHUB_SHA",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          cat version.json

      - name: 릴리즈에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          APK="device_app-$BUILD_NUMBER.apk"

          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "DeviceApp 최신 빌드 (자동 업데이트용)" \
              --notes "main 브랜치에 push하면 GitHub Actions가 자동으로 갱신합니다. 기기 앱은 version.json을 보고 업데이트합니다."
          fi

          # APK를 먼저 올리고 version.json을 나중에 바꿔야
          # 기기가 아직 없는 APK 주소를 받는 일이 없다.
          gh release upload "$RELEASE_TAG" "$APK" --clobber
          gh release upload "$RELEASE_TAG" version.json --clobber

          # 지난 빌드 APK 정리
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' \
            | grep -E '^device_app-[0-9]+\.apk$' \
            | grep -vxF "$APK" \
            | while read -r OLD; do gh release delete-asset "$RELEASE_TAG" "$OLD" --yes; done

          echo "### DeviceApp $VERSION_NAME ($BUILD_NUMBER) 업로드 완료" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" >> "$GITHUB_STEP_SUMMARY"
